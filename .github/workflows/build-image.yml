# Builds the PCC Education image (Frappe v16 + ERPNext + HRMS + Education)
# with frappe_docker's layered Containerfile, and publishes it to GHCR.
# The VPS only pulls the finished image; nothing is built on the server.
name: Build image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps.json
      - .github/workflows/build-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/crimsoin/pcc-education
  FRAPPE_BRANCH: version-16

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Record frappe_docker commit
        id: fd
        run: echo "sha=$(git -C frappe_docker rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            FRAPPE_PATH=https://github.com/frappe/frappe
            CACHE_BUST=${{ github.run_id }}
          secret-files: |
            apps_json=apps.json
          tags: |
            ${{ env.IMAGE }}:16
            ${{ env.IMAGE }}:16-build${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Frappe v16 + ERPNext + HRMS + Education for Philippine Coding Camp
            pcc.frappe-docker-commit=${{ steps.fd.outputs.sha }}

      - name: Show installed app versions
        run: |
          docker run --rm --entrypoint bash ${{ env.IMAGE }}:16-build${{ github.run_number }} \
            -c 'cd /home/frappe/frappe-bench && env/bin/python -c "import frappe, erpnext, hrms, education; [print(m.__name__, m.__version__) for m in (frappe, erpnext, hrms, education)]"'
